name: Checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  python:
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - run: python -m unittest discover -s tests -v
        working-directory: taskd
      - run: python -m unittest discover -s tests -v
        working-directory: agent-portal
      - run: python examples/local_roundtrip.py
      - run: python taskd/build.py
      - run: node --check agent-portal/static/app.js && node agent-portal/tests/test_execution_ui.js
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - run: python -m unittest discover -s tests -p test_binding.py -v
        working-directory: taskd
      - run: python -m unittest discover -s tests -p test_platform.py -v
        working-directory: taskd
